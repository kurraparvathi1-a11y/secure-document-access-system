<!DOCTYPE html>
<html>
<head><title>Secure Docs</title>
<style>
body{font-family:Arial;background:#f4f4f4;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:white;padding:25px;border-radius:8px;width:320px;box-shadow:0 0 10px #ccc}
input,select,button{width:100%;padding:10px;margin:8px 0;border-radius:5px;border:1px solid #ccc}
button{background:#007bff;color:white;border:none;cursor:pointer}
a{color:#007bff;text-decoration:none;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div id="loginForm">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p>Account ledu? <a onclick="showRegister()">Register</a></p>
  </div>

  <div id="registerForm" style="display:none;">
    <h2>Register</h2>
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Password">
    <select id="regRole"><option value="Viewer">Viewer</option><option value="Manager">Manager</option></select>
    <button onclick="register()">Register</button>
    <p>Already account unda? <a onclick="showLogin()">Login</a></p>
  </div>

  <div id="dashboard" style="display:none;">
    <h3>Welcome <span id="userEmail"></span></h3>
    <p>Role: <span id="userRole"></span></p>
    <div id="createArea"><input id="docTitle" placeholder="Title"><input id="docContent" placeholder="Content"><button onclick="createDoc()">Create Document</button></div>
    <div id="docList"></div>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<script>
let users = JSON.parse(localStorage.getItem('users')) || [{email:'admin@sec.com',password:'admin123',role:'Admin'}];
let docs = JSON.parse(localStorage.getItem('docs')) || [{title:'Company Policy',content:'Only admin can see this'}];
function showRegister(){loginForm.style.display='none';registerForm.style.display='block';}
function showLogin(){registerForm.style.display='none';loginForm.style.display='block';}
function register(){
  let e=regEmail.value,p=regPassword.value,r=regRole.value;
  if(!e||!p){alert('Fill all');return;}
  if(users.find(u=>u.email===e)){alert('Already exists');showLogin();return;}
  users.push({email:e,password:p,role:r});localStorage.setItem('users',JSON.stringify(users));
  alert('Register Success! Login chey');showLogin();
}
function login(){
  let e=email.value,p=password.value;
  let u=users.find(x=>x.email===e && x.password===p);
  if(!u){alert('Do you have an account? Please register');return;}
  localStorage.setItem('currentUser',JSON.stringify(u));
  showDashboard(u);
}
function showDashboard(u){
  loginForm.style.display='none';registerForm.style.display='none';dashboard.style.display='block';
  userEmail.innerText=u.email;userRole.innerText=u.role;renderDocs();
}
function renderDocs(){docList.innerHTML='';docs.forEach(d=>{docList.innerHTML+=`<div style="border:1px solid #ccc;padding:5px;margin:5px;"><b>${d.title}</b><br>${d.content}</div>`});}
function createDoc(){let t=docTitle.value,c=docContent.value;if(!t||!c){alert('Fill');return;}docs.push({title:t,content:c});localStorage.setItem('docs',JSON.stringify(docs));renderDocs();docTitle.value='';docContent.value='';}
function logout(){localStorage.removeItem('currentUser');dashboard.style.display='none';loginForm.style.display='block';}
let cu=JSON.parse(localStorage.getItem('currentUser'));if(cu){showDashboard(cu);}
</script>
</body>
</html>
